<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>座席表アーカイブ — 梅田</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E9EF; --sheet:#F8FAFC; --ink:#131C26; --line:#C6D0DB;
  --muted:#71808F; --accent:#D4000F; --alt:#1B62C8;
  --mono:'DM Mono',ui-monospace,monospace;
  --sans:'Zen Kaku Gothic New',system-ui,sans-serif;
  --serif:'Zen Old Mincho',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgba(19,28,38,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(19,28,38,.045) 1px,transparent 1px);
  background-size:24px 24px;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(8px);
  background:rgba(228,233,239,.88);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;
  align-items:baseline;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:900;font-size:21px;letter-spacing:.04em}
.brand em{font-style:normal;color:var(--accent)}
.stat{font-family:var(--mono);font-size:12px;color:var(--muted)}

.shell{max-width:1180px;margin:0 auto;padding:34px 24px 96px}

/* ── 入口 ───────────────────────────────────────────── */
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.gate{display:block;background:var(--sheet);border:1px solid var(--line);border-radius:3px;
  padding:22px 24px 20px;position:relative;overflow:hidden;
  transition:border-color .15s,box-shadow .15s,transform .15s}
.gate:hover{border-color:var(--ink);box-shadow:0 4px 20px rgba(19,28,38,.13);
  transform:translateY(-2px)}
.gate::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.gate-kind{font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted)}
.gate-name{font-family:var(--serif);font-weight:900;font-size:26px;margin:2px 0 10px}
.gate-nums{display:flex;gap:20px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.gate-nums b{display:block;font-size:22px;font-weight:500;color:var(--ink);line-height:1.2}
.gate-foot{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;
  justify-content:space-between;gap:10px}
.gate-foot .go{color:var(--c)}

/* ── 見出し ─────────────────────────────────────────── */
.sec{margin-top:56px}
.sec-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;
  padding-bottom:9px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.sec-title{font-family:var(--serif);font-weight:900;font-size:24px;line-height:1}
.sec-note{font-family:var(--mono);font-size:11px;color:var(--muted);padding-bottom:3px}
.sec-tools{margin-left:auto;display:flex;gap:8px;align-items:center;padding-bottom:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:5px 11px;
  background:var(--sheet);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.find{font-family:var(--mono);font-size:12px;padding:5px 9px;border:1px solid var(--line);
  border-radius:2px;background:var(--sheet);color:var(--ink);width:150px}
.caveat{font-size:12px;color:var(--muted);margin:10px 0 22px;max-width:62ch}

.legend{display:flex;gap:16px;font-family:var(--mono);font-size:11px;color:var(--muted);
  margin-bottom:20px}
.legend i{display:inline-block;width:16px;height:2px;vertical-align:middle;
  margin-right:6px;background:currentColor}

/* ── グラフ ─────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:2px;
  padding:14px 15px 10px;display:flex;flex-direction:column;gap:10px;
  transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--ink);box-shadow:0 3px 14px rgba(19,28,38,.1)}
.card.-wide{grid-column:1/-1;background:var(--ink);color:#E9EEF4;border-color:var(--ink)}
.card.-wide .c-sub,.card.-wide .c-num span{color:#8FA0B2}
.card.-wide .c-num b{color:#fff}
.c-head{display:grid;grid-template-columns:38px minmax(0,1fr);gap:11px;align-items:start}
.card.-wide .c-head{grid-template-columns:minmax(0,1fr)}
.c-poster{width:38px;aspect-ratio:2/3;object-fit:cover;background:var(--line);
  border:1px solid var(--line);border-radius:2px}
.c-poster.-ph{display:grid;place-items:center;font-family:var(--mono);font-size:7px;
  color:var(--muted);text-align:center}
.c-title{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.c-nums{display:flex;gap:18px;margin-top:6px}
.c-num{font-family:var(--mono);font-size:10px}
.c-num b{display:block;font-size:16px;font-weight:500;line-height:1.25}
.c-num span{color:var(--muted)}
.chart{width:100%;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.card.-wide .chart .grid{stroke:#33414F}
.chart .axis{font-family:var(--mono);font-size:8px;fill:var(--muted)}
.card.-wide .chart .axis{fill:#7E8FA1}
.chart .ln{fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{stroke:var(--sheet);stroke-width:1}
.card.-wide .chart .dot{stroke:var(--ink)}
.chart .hit{fill:transparent}
.empty{padding:48px 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px}
.empty code{background:var(--sheet);border:1px solid var(--line);padding:2px 6px;border-radius:2px}
.more{margin:22px auto 0;display:block;font-family:var(--mono);font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;padding:8px 22px;
  border:1px solid var(--ink);border-radius:2px;background:var(--sheet)}
.more:hover{background:var(--ink);color:var(--sheet)}
.more[hidden]{display:none}      /* .more の display:block より後に置くこと */
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="brand">梅田 <em>二館</em></span>
    <span class="stat" id="stat">読み込み中…</span>
  </div>
</header>

<main class="shell">
  <div class="gates" id="gates"></div>

  <section class="sec">
    <div class="sec-head">
      <span class="sec-title">売れ行き</span>
      <span class="sec-note" id="range"></span>
      <span class="sec-tools">
        <span class="seg" id="mode">
          <button data-mode="cum" aria-pressed="true">累計</button>
          <button data-mode="day" aria-pressed="false">日別</button>
        </span>
        <input class="find" id="find" type="search" placeholder="作品を絞る" autocomplete="off">
      </span>
    </div>
    <p class="caveat" id="caveat"></p>
    <div class="legend" id="legend"></div>
    <div class="cards" id="cards"><div class="empty">読み込み中…</div></div>
    <button class="more" id="more" hidden>もっと見る</button>
  </section>
</main>

<script>
'use strict';

const STATS = 'data/stats.json';
const PAGE = 24;
const state = {stats:null, mode:'cum', q:'', shown:PAGE};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => (n ?? 0).toLocaleString('ja-JP');
const md = d => `${+d.slice(5,7)}/${+d.slice(8,10)}`;

// ── 入口カード（各館の索引から件数だけ借りる）─────────────────
async function renderGates(cinemas){
  const rows = await Promise.all(cinemas.map(async c => {
    let idx = null;
    try{
      const r = await fetch(`${c.dir}/data/index.json`, {cache:'no-cache'});
      if(r.ok) idx = await r.json();
    }catch(_){}
    return {c, idx};
  }));

  $('#gates').innerHTML = rows.map(({c, idx}) => {
    const days = idx?.dates || [];
    const last = days.length ? days[0].date : null;
    return `<a class="gate" href="${esc(c.dir)}/index.html" style="--c:${esc(c.color)}">
      <div class="gate-kind">Cinema</div>
      <div class="gate-name">${esc(c.name)}</div>
      <div class="gate-nums">
        <span><b>${nf(idx?.total_captures ?? 0)}</b>座席表</span>
        <span><b>${nf(idx?.total_records ?? 0)}</b>上映回</span>
        <span><b>${nf((idx?.films || []).length)}</b>作品</span>
      </div>
      <div class="gate-foot">
        <span>${last ? `最新 ${esc(md(last))}` : 'データなし'}</span>
        <span class="go">日別・作品別を見る →</span>
      </div>
    </a>`;
  }).join('');

  const tot = rows.reduce((a, {idx}) => a + (idx?.total_captures ?? 0), 0);
  $('#stat').textContent = `座席表 ${nf(tot)} 枚`;
}

// ── 系列づくり ────────────────────────────────────────
// series は {cinemaId: {"2026-08-29": 売れた席数}}。日付の穴は 0 で埋め、
// 累計表示のときはそのまま足し上げる（撮れなかった日は横ばいに見える）。
function seriesOf(film, dates, mode){
  return state.stats.cinemas.map(c => {
    const raw = film.series[c.id] || {};
    let acc = 0;
    const pts = dates.map(d => {
      const v = raw[d] || 0;
      acc += v;
      return mode === 'cum' ? acc : v;
    });
    return {c, pts, has: Object.keys(raw).length > 0};
  }).filter(s => s.has);
}

function datesOf(film){
  const all = state.stats.dates;
  return all.filter(d => d >= film.first && d <= film.last);
}

// ── 折れ線 ────────────────────────────────────────────
function chart(dates, series, {w = 320, h = 104} = {}){
  const padL = 30, padR = 6, padT = 8, padB = 15;
  const iw = w - padL - padR, ih = h - padT - padB;
  const max = Math.max(1, ...series.flatMap(s => s.pts));
  const step = dates.length > 1 ? iw / (dates.length - 1) : 0;
  const X = i => padL + (dates.length > 1 ? i * step : iw / 2);
  const Y = v => padT + ih - (v / max) * ih;

  // 目盛りは 0 と最大値だけ。小さい図に線を増やしても読めない。
  const grid = [0, max].map(v =>
    `<line class="grid" x1="${padL}" x2="${w - padR}" y1="${Y(v)}" y2="${Y(v)}"></line>
     <text class="axis" x="${padL - 4}" y="${Y(v) + 3}" text-anchor="end">${nf(v)}</text>`
  ).join('');

  const xlab = dates.length
    ? `<text class="axis" x="${X(0)}" y="${h - 3}">${esc(md(dates[0]))}</text>
       <text class="axis" x="${X(dates.length - 1)}" y="${h - 3}"
             text-anchor="end">${esc(md(dates[dates.length - 1]))}</text>` : '';

  const lines = series.map(s => {
    const d = s.pts.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    const dots = dates.length <= 40
      ? s.pts.map((v, i) =>
          `<circle class="dot" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2"
                   fill="${esc(s.c.color)}"><title>${esc(s.c.short)} ${esc(md(dates[i]))} ${nf(v)} 席</title></circle>`
        ).join('') : '';
    return `<path class="ln" d="${d}" stroke="${esc(s.c.color)}"></path>${dots}`;
  }).join('');

  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img"
    aria-label="劇場別の推移">${grid}${xlab}${lines}</svg>`;
}

// ── 作品カード ────────────────────────────────────────
function cardEl(film){
  const dates = datesOf(film);
  const series = seriesOf(film, dates, state.mode);
  const poster = film.poster
    ? `<img class="c-poster" src="${esc(film.poster)}" alt="" loading="lazy"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),
           {className:'c-poster -ph',textContent:'NO IMAGE'}))">`
    : `<div class="c-poster -ph">NO IMAGE</div>`;

  const nums = state.stats.cinemas.map(c => {
    const t = film.totals[c.id];
    if(!t) return '';
    return `<span class="c-num"><b style="color:${esc(c.color)}">${nf(t.sold)}</b>
      <span>${esc(c.short)} · ${nf(t.shows)}回</span></span>`;
  }).join('');

  return `<article class="card">
    <div class="c-head">
      ${poster}
      <div>
        <div class="c-title">${esc(film.title)}</div>
        <div class="c-sub">${esc(md(film.first))} – ${esc(md(film.last))}</div>
        <div class="c-nums">${nums}</div>
      </div>
    </div>
    ${series.length ? chart(dates, series) : '<div class="empty">データなし</div>'}
  </article>`;
}

// 全作品を足した図。1 枚だけ横幅いっぱいで先頭に置く。
function totalCard(){
  const dates = state.stats.dates;
  if(!dates.length) return '';
  const merged = {series:{}, totals:{}};
  for(const c of state.stats.cinemas){
    const day = {};
    let sold = 0, shows = 0;
    for(const f of state.stats.films){
      for(const [d, v] of Object.entries(f.series[c.id] || {})) day[d] = (day[d] || 0) + v;
      const t = f.totals[c.id];
      if(t){ sold += t.sold; shows += t.shows; }
    }
    if(shows){ merged.series[c.id] = day; merged.totals[c.id] = {sold, shows}; }
  }
  const series = seriesOf(merged, dates, state.mode);
  const nums = state.stats.cinemas.map(c => {
    const t = merged.totals[c.id];
    if(!t) return '';
    return `<span class="c-num"><b style="color:${esc(c.color)}">${nf(t.sold)}</b>
      <span>${esc(c.short)} · ${nf(t.shows)}回</span></span>`;
  }).join('');
  return `<article class="card -wide">
    <div class="c-head"><div>
      <div class="c-title">全作品 合計</div>
      <div class="c-sub">${esc(md(dates[0]))} – ${esc(md(dates[dates.length - 1]))}</div>
      <div class="c-nums">${nums}</div>
    </div></div>
    ${chart(dates, series, {w: 900, h: 190})}
  </article>`;
}

function render(){
  const q = state.q.trim().toLowerCase();
  const list = state.stats.films.filter(f => !q || f.title.toLowerCase().includes(q));
  const page = list.slice(0, state.shown);

  $('#cards').innerHTML = (q ? '' : totalCard())
    + (page.length ? page.map(cardEl).join('')
       : '<div class="empty">該当する作品がありません</div>');
  const rest = Math.max(0, list.length - state.shown);
  $('#more').hidden = rest === 0;
  $('#more').textContent = `もっと見る（残り ${nf(rest)}）`;
}

async function load(){
  let stats = null;
  try{
    const r = await fetch(STATS, {cache:'no-cache'});
    if(r.ok) stats = await r.json();
  }catch(_){}

  if(!stats){
    $('#gates').innerHTML = '';
    $('#cards').innerHTML = `<div class="empty">
      data/stats.json がありません。<code>python hub.py build</code> で作ってください。<br>
      （file:// では読めません。<code>python hub.py serve</code> 経由で開いてください）</div>`;
    $('#stat').textContent = '未生成';
    return;
  }

  state.stats = stats;
  await renderGates(stats.cinemas);

  const d = stats.dates;
  $('#range').textContent = d.length ? `${md(d[0])} – ${md(d[d.length - 1])}` : '';
  $('#caveat').textContent = stats.note
    + ' 座席表が撮れなかった回は数に入っていないので、実数の下限として読むこと。';
  $('#legend').innerHTML = stats.cinemas.map(c =>
    `<span style="color:${esc(c.color)}"><i></i>${esc(c.name)}</span>`).join('');
  render();
}

$('#mode').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]');
  if(!b) return;
  state.mode = b.dataset.mode;
  [...$('#mode').children].forEach(x =>
    x.setAttribute('aria-pressed', String(x === b)));
  render();
});
$('#find').addEventListener('input', e => {
  state.q = e.target.value; state.shown = PAGE; render();
});
$('#more').addEventListener('click', () => { state.shown += PAGE; render(); });

load().catch(err => {
  $('#cards').innerHTML = `<div class="empty">${esc(err.message)}</div>`;
});
</script>
</body>
</html>
